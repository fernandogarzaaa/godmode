name: adam-binaries
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, target: x86_64-pc-windows-msvc, asset: adam-mcp-win-x64.exe, ext: .exe }
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu, asset: adam-mcp-linux-x64, ext: "" }
          - { os: macos-latest, target: aarch64-apple-darwin, asset: adam-mcp-darwin-arm64, ext: "" }
    runs-on: ${{ matrix.os }}
    defaults: { run: { working-directory: vendors/adam } }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo build --release --target ${{ matrix.target }} -p adam-mcp
      - name: Smoke the built binary
        run: >
          echo '{"jsonrpc":"2.0","id":1,"method":"tools/list","params":{}}'
          | ./target/${{ matrix.target }}/release/adam-mcp${{ matrix.ext }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: vendors/adam/target/${{ matrix.target }}/release/adam-mcp${{ matrix.ext }}
  release:
    needs: [build]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/download-artifact@v4
        with: { path: dist-adam, merge-multiple: true }
      - uses: softprops/action-gh-release@v2
        with: { files: dist-adam/* }
