name: auto-update
# Keeps vendors/ in sync with the 5 source repos. Triggers:
#  - schedule (6h backstop): compares HEAD SHAs vs vendors/manifest.yaml pins
#  - repository_dispatch (instant): source repos fire `source-updated` on push to main
#  - workflow_dispatch (manual): optional `repos` csv filter, `force` to re-sync anyway
# Always ends in ONE batched PR for human review — never auto-merges.
on:
  schedule: [{ cron: "0 */6 * * *" }]
  workflow_dispatch:
    inputs:
      repos: { description: "csv subset (default: all)", required: false, default: "" }
      force: { description: "re-sync even if SHAs match", required: false, default: false, type: boolean }
  repository_dispatch:
    types: [source-updated]
permissions: { contents: read }
jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
      shas: ${{ steps.diff.outputs.shas }}
    steps:
      - uses: actions/checkout@v4
      - id: diff
        env:
          DISPATCH_REPO: ${{ github.event.client_payload.repo }}
          DISPATCH_SHA: ${{ github.event.client_payload.sha }}
          INPUT_REPOS: ${{ inputs.repos }}
          FORCE: ${{ inputs.force }}
        run: |
          node -e "
          const pins = JSON.parse(require('child_process').execSync('node scripts/sync-vendors.mjs --check',{encoding:'utf8'}));
          const { execSync } = require('child_process');
          const repos = { genesis:'fernandogarzaaa/genesis','eve':'fernandogarzaaa/experience-validation-engine',adam:'fernandogarzaaa/ADAM',skein:'fernandogarzaaa/skein','eve-miro':'fernandogarzaaa/EVE---MIRO' };
          const filter = (process.env.INPUT_REPOS||'').split(',').map(s=>s.trim()).filter(Boolean);
          const payloadRepo = String(process.env.DISPATCH_REPO||'').split('/').pop();
          const payloadSha = process.env.DISPATCH_SHA || '';
          const shas = {}, changed = [];
          for (const n of Object.keys(repos)) {
            if (filter.length && !filter.includes(n)) continue;
            let sha = (payloadRepo === n && payloadSha) ? payloadSha : '';
            if (!sha) sha = execSync('git ls-remote https://github.com/'+repos[n]+' HEAD').toString().split(/\s/)[0];
            shas[n] = sha;
            if (process.env.FORCE==='true' || pins[n] !== sha) changed.push(n);
          }
          require('fs').appendFileSync(process.env.GITHUB_OUTPUT, 'changed='+JSON.stringify(changed)+'\nshas='+JSON.stringify(shas)+'\n');
          "
  sync:
    needs: [resolve]
    if: needs.resolve.outputs.changed != '[]'
    runs-on: ubuntu-latest
    permissions: { contents: write, pull-requests: write }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Clone changed sources at pinned SHAs
        env:
          CHANGED: ${{ needs.resolve.outputs.changed }}
          SHAS: ${{ needs.resolve.outputs.shas }}
        run: |
          node -e "
          const changed = JSON.parse(process.env.CHANGED), shas = JSON.parse(process.env.SHAS);
          const repos = { genesis:'fernandogarzaaa/genesis','eve':'fernandogarzaaa/experience-validation-engine',adam:'fernandogarzaaa/ADAM',skein:'fernandogarzaaa/skein','eve-miro':'fernandogarzaaa/EVE---MIRO' };
          const { execSync } = require('child_process');
          for (const n of changed) {
            execSync('git clone --depth 1 https://github.com/'+repos[n]+' /tmp/src-'+n, {stdio:'inherit'});
            execSync('git -C /tmp/src-'+n+' fetch --depth 1 origin '+shas[n]+' && git -C /tmp/src-'+n+' checkout '+shas[n], {stdio:'inherit'});
          }"
      - name: Re-vendor
        env:
          CHANGED: ${{ needs.resolve.outputs.changed }}
          SHAS: ${{ needs.resolve.outputs.shas }}
        run: |
          node -e "
          const changed = JSON.parse(process.env.CHANGED), shas = JSON.parse(process.env.SHAS);
          const { execSync } = require('child_process');
          const a = [];
          for (const n of changed) a.push('--src-'+n, '/tmp/src-'+n, '--sha-'+n, shas[n]);
          execSync('node scripts/sync-vendors.mjs --only '+changed.join(',')+' '+a.join(' '), {stdio:'inherit'});
          "
      - name: Update manifest pins
        env:
          CHANGED: ${{ needs.resolve.outputs.changed }}
          SHAS: ${{ needs.resolve.outputs.shas }}
        run: |
          node -e "
          const fs = require('fs');
          const changed = JSON.parse(process.env.CHANGED), shas = JSON.parse(process.env.SHAS);
          let txt = fs.readFileSync('vendors/manifest.yaml','utf8');
          for (const n of changed) txt = txt.replace(new RegExp('(  '+n+':\\n(?:.*\\n)*?    pin: )\\S+'), '\$1'+shas[n]);
          fs.writeFileSync('vendors/manifest.yaml', txt);
          "
      - name: Rebuild dists
        run: |
          npm --prefix vendors/genesis install --ignore-scripts --no-audit --no-fund
          npm --prefix vendors/genesis run build
          npm --prefix vendors/eve install --ignore-scripts --no-audit --no-fund
          npm --prefix vendors/eve run build
      - name: License gate
        run: node scripts/check-licenses.mjs
      - name: Verify (doctor + smoke + tests)
        run: |
          npm install --omit=dev --no-audit --no-fund
          node bin/godmode.js doctor
          node scripts/smoke.mjs
          node --test tests/godmode.test.js
          node scripts/fetch-adam.mjs --check || true
      - name: Open update PR
        uses: peter-evans/create-pull-request@v7
        with:
          # Default GITHUB_TOKEN works once the repo setting
          # "Allow GitHub Actions to create and approve pull requests" is ON.
          # Set GODMODE_SYNC_TOKEN (PAT, write on godmode) to skip that setting.
          token: ${{ secrets.GODMODE_SYNC_TOKEN || github.token }}
          branch: auto-update/${{ github.run_id }}
          delete-branch: true
          labels: auto-update
          title: "chore(auto-update): sync vendors ${{ needs.resolve.outputs.changed }}"
          body: |
            Automated vendor sync. **Human merge required — CI must be green.**
            - Changed: `${{ needs.resolve.outputs.changed }}`
            - SHAs: `${{ needs.resolve.outputs.shas }}`
            - Steps run: re-vendor → manifest pins → dist rebuild → license gate → doctor/smoke/tests.
            - Compare upstream: https://github.com/fernandogarzaaa/godmode/compare/main...auto-update/${{ github.run_id }} (per-repo diffs in commit messages below).
