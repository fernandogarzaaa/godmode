name: ci
on: [push, pull_request]
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
permissions: { contents: read }
jobs:
  godmode:
    strategy:
      matrix: { node: [20, 22] }
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: npm install --omit=dev --no-audit --no-fund
      - run: node scripts/check-licenses.mjs
      - run: node bin/godmode.js doctor
      - run: node scripts/smoke.mjs
      - run: node --test tests/godmode.test.js
      - run: node scripts/fetch-adam.mjs --check || true
      - uses: dtolnay/rust-toolchain@stable
      - name: ADAM binary handshake (builds from vendors/adam if missing)
        run: node scripts/verify-adam.mjs --build-if-missing
      - name: Skein import check (vendored)
        run: PYTHONPATH=vendors/skein/src python -c "import skein.cli; print('skein ok')"
      - name: Genesis dist present
        run: test -f vendors/genesis/dist/cli/run.js && test -f vendors/eve/dist/cli/main.js
